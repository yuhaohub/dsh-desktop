name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (arm64 + x64)
    runs-on: macos-14
    env:
      # 开源项目无签名证书，跳过自动签名发现
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 生成图标并打包两个架构（zip + dmg）。package.json 的 dist 脚本已含
      # --publish never（只构建），发布统一由下方 softprops 步骤用
      # GITHUB_TOKEN 完成。注意：不要再追加 --publish，重复参数会被 yargs
      # 解析成数组导致发布被意外触发。
      - run: npm run dist -- --arm64 --x64

      # install.sh 也作为 Release 资产发布，安装命令可走
      # releases/latest/download/install.sh，不受 raw CDN 缓存影响
      - name: Stage installer as release asset
        run: cp scripts/install.sh dist/install.sh

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/install.sh
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
